[package]
name = "harvester"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"] }
scraper = "0.22"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
url = "2.5"
futures = "0.3"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
urlencoding = "2.1"
log = "0.4"
env_logger = "0.11"
dotenv = "0.15"

